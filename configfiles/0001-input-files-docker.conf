# SOF-ELK® Docker-specific File Input Configuration
# This file provides file input handling specifically for Docker deployment testing

input {
  # Test input for Evtxecmd JSON files
  file {
    path => ["/data/kape/**/*_EvtxECmd_Output.json"]
    start_position => "beginning"
    tags => ["json", "process_archive", "docker_test"]
    add_field => { "[labels][type]" => "kape_evtxlogs" }
    codec => "json_lines"
  }
}